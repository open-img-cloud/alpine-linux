# Alpine cloud-init config for openimages.cloud builds.
# Mirrors the alpaquita cloud.cfg shape but with `distro: alpine` and
# `default_user.name: alpine` so cloud-init's distro class is the
# upstream Alpine one (handles apk, openrc, /bin/ash, etc.).

users:
  - default
disable_root: true
mount_default_fields: [~, ~, 'auto', 'defaults,nofail', '0', '2']
resize_rootfs_tmp: /dev
ssh_pwauth: false
preserve_hostname: false
# Single-line array so ds-identify reads it correctly.
datasource_list: ['OpenStack', 'ConfigDrive', 'None']
cloud_init_modules:
  - seed_random
  - bootcmd
  - write_files
  - growpart
  - resizefs
  - disk_setup
  - mounts
  - set_hostname
  - update_hostname
  - update_etc_hosts
  - resolv_conf
  - ca_certs
  - rsyslog
  - users_groups
  - ssh
  - set_passwords
cloud_config_modules:
  - ssh_import_id
  - keyboard
  - locale
  - ntp
  - timezone
  - disable_ec2_metadata
  - runcmd
cloud_final_modules:
  - package_update_upgrade_install
  - write_files_deferred
  - puppet
  - chef
  - ansible
  - mcollective
  - salt_minion
  - scripts_vendor
  - scripts_per_once
  - scripts_per_boot
  - scripts_per_instance
  - scripts_user
  - ssh_authkey_fingerprints
  - keys_to_console
  - install_hotplug
  - phone_home
  - final_message
  - power_state_change
system_info:
  distro: alpine
  default_user:
    name: alpine
    lock_passwd: False
    gecos: Alpine Cloud User
    groups: [adm, wheel]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/ash
  network:
    renderers: ['eni']
  paths:
    cloud_dir: /var/lib/cloud/
    templates_dir: /etc/cloud/templates/
  ssh_svcname: sshd
